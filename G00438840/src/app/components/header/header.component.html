<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-button slot ="start">
      <ion-back-button class="back-button"defaultHref="/home" fill="clear"
      icon="chevron-back-outline">
    </ion-back-button>
    </ion-button>

    <ion-title class ="title-center">
      G00438840 <!-- Project Title (Student ID)-->
    </ion-title>

    <ion-buttons slot="end">
       <ion-button slot ="start"(click)="goToHome()" name="home"> <!--Home Icon button-->
          <ion-icon name="home" style="color: blue" size="large"></ion-icon>
        </ion-button>
      <ion-button (click)="goToFav()"name="Favourites"> <!--Favourites Icon button-->
        <ion-icon name="heart" style="color: red;" size="large"></ion-icon>
      </ion-button>
      <ion-button (click)="goToSettings()" name="settings"> <!--Settings Icon button-->
        <ion-icon name="Settings" style="color: rgba(12, 12, 12, 0.74);" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
