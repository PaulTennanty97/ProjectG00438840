<ion-header [translucent]="true">
  <!--
  This header component was created to store the back button, Projec Title, Home Button, Favourite Button and Settings Button. 
  -->
  <ion-toolbar>
    <ion-button slot ="start">
      <!-- Back Button-->
      <ion-back-button class="back-button"defaultHref="/home" fill="clear"
      icon="chevron-back-outline">
    </ion-back-button>
    </ion-button>

    <ion-title class ="title-center"> <!--Project Title-->
      G00438840 <!-- Project Title (Student ID)-->
    </ion-title>

    <ion-buttons slot="end">
        <!-- Home Button when selected brings users to home page-->
      <ion-button slot ="start"(click)="goToHome()" name="home"> <!--Home Icon button-->
        <ion-icon name="home" style="color: blue" size="large"></ion-icon>
      </ion-button> 
        <!-- Favourites Button when selected brings users to Favourites page-->
      <ion-button (click)="goToFav()"name="Favourites">
        <ion-icon name="heart" style="color: red;" size="large"></ion-icon>
      </ion-button>
      <!--Settings Button when selected brings users to the Settings page-->
      <ion-button (click)="goToSettings()" name="settings"> <!--Settings Icon button-->
        <ion-icon name="Settings" style="color: rgba(12, 12, 12, 0.74);" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
